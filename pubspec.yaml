name: mero_focus
description: "Focus, capture and spaced-repetition review app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management. NOTE: providers are written manually (no
  # riverpod_generator/annotation) because the pinned Dart 3.11 SDK and
  # meta 1.17.0 cannot satisfy the analyzer constraints of the generator
  # and drift_dev simultaneously. See README "Implementation deviations".
  flutter_riverpod: ^3.3.2

  # Local database.
  drift: 2.34.0
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1

  # Localization, formatting, reporting.
  intl: 0.20.2
  pdf: ^3.12.0
  printing: ^5.14.3

  # Permissions, notifications and background execution.
  permission_handler: ^13.0.2
  flutter_local_notifications: ^19.4.2
  shared_preferences: ^2.5.6

  # Legacy (migrated feature-by-feature; removed as each feature is rebuilt).
  flutter_bloc: ^9.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  equatable: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.15.1
  drift_dev: 2.34.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/translations/
