name: mero_focus
description: "Focus, capture and spaced-repetition review app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management. NOTE: providers are written manually (no
  # riverpod_generator/annotation) because the pinned Dart 3.11 SDK and
  # meta 1.17.0 cannot satisfy the analyzer constraints of the generator
  # and drift_dev simultaneously. See README "Implementation deviations".
  flutter_riverpod: ^3.3.2

  # Local database.
  drift: 2.34.0
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  path: ^1.9.1

  # Localization, formatting, reporting.
  intl: 0.20.2
  pdf: ^3.12.0
  printing: ^5.14.3

  # Permissions, notifications and background execution.
  # 13.x pulls permission_handler_android 14.x, whose Gradle script requires
  # AGP 9. This project uses the Flutter 3.41 Android template baseline
  # (AGP 8.7), so stay on the AGP-8-compatible 12.x line.
  permission_handler: 12.0.3
  flutter_local_notifications: ^19.4.2
  shared_preferences: ^2.5.6

  # Foreground service + floating timer overlay (ADR-0009). Versions are
  # pinned to the last releases compatible with Flutter 3.41 / Dart 3.11:
  # flutter_foreground_task 11 requires Dart 3.12 / Flutter 3.44.
  flutter_foreground_task: 10.0.0
  flutter_overlay_window: 1.0.2

  # Legacy (migrated feature-by-feature; removed as each feature is rebuilt).
  flutter_bloc: ^9.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  equatable: ^3.0.0
  audioplayers: ^6.1.0
  image_picker: ^1.1.2
  home_widget: ^0.9.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: 2.15.1
  drift_dev: 2.34.0
  # Used by the schema-migration test to author a real v1 SQLite file.
  bloc_test: ^10.0.0
  mocktail: ^1.0.5

dependency_overrides:
  archive: ^4.4.0
  image: ^4.11.1

flutter:
  uses-material-design: true
  generate: true
  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
  assets:
    - assets/images/
    - assets/images/backgrounds/
    - assets/fonts/
    - assets/translations/
    - assets/sounds/
