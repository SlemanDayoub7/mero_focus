name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.2"
          channel: "stable"
      - run: flutter pub get
      # Verify the checked-in ARB files still generate cleanly.
      - run: flutter gen-l10n
      - run: flutter analyze
